// Autoritativo secundario. Recebe zona do NS1 pela rede interna.
include "/etc/bind/rndc.key";
controls { inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; }; };
options {
    directory "/var/lib/bind";
    recursion no;
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    min-refresh-time 10;
    min-retry-time 5;
};
zone "sd.lab" IN {
    type secondary;
    primaries { 172.30.0.11; };
    file "/var/lib/bind/db.sd.lab";
};

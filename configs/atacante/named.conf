// Servidor autoritativo FALSO, criado exclusivamente para experimento E9.
include "/etc/bind/rndc.key";
controls { inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; }; };
options {
    directory "/var/lib/bind";
    recursion no;
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    allow-query { any; };
};
zone "sd.lab" IN {
    type primary;
    file "/etc/bind/db.sd.lab.adulterado";
};
